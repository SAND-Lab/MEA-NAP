[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meanap"
version = "0.1.0"
description = "MEA Network Analysis Pipeline (MEA-NAP) — Python implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # numpy capped <2.5 so numba can load (numba requires numpy<=2.4). numba
    # JIT-compiles the Step-4 network-randomization hot loop
    # (randmio_und_signed), ~28x faster than the pure-Python fallback; the
    # code runs without numba too, just slower (see pipeline/null_models.py).
    "numpy>=1.26,<2.5",
    "numba>=0.60",
    "psutil>=5.9",  # RAM/CPU-aware parallel worker sizing (pipeline/parallel.py)
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "networkx>=3.3",
    "h5py>=3.11",
    "sciplotlib>=0.0.7",
    "Pillow>=10.0",
    "natsort>=8.4",
    "pyqt6>=6.11.0",
    "pybaselines>=1.2.1",
    "tqdm>=4.68.3",
    "PyWavelets>=1.6",
    "openpyxl>=3.1",
    "pyqtdarktheme>=2.1.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.4",
    # Mixed-effects models for the stats step: age/genotype comparisons need
    # random intercepts per culture, because the same culture is imaged at
    # several DIVs and its recordings are not independent samples.
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# CAT-NAP's denoising deconvolves each trace with OASIS. Without it the code
# falls back to Savitzky-Golay smoothing, which yields a *different peak train*
# and so different adjacency matrices — a silent change of result, not a
# degradation of speed. Kept optional because it is a compiled extension, but
# declared here so `uv sync --extra oasis` does not quietly uninstall it.
oasis = [
    "oasis-deconv>=0.3.2",
]

[project.scripts]
meanap-gui = "meanap.gui.app:main"
meanap-viewer = "meanap.viewer.server:main"
meanap-preflight = "meanap.remote.cli:main"
meanap-stats = "meanap.stats.cli:main"
meanap-shared = "meanap.shared.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meanap"]

[tool.ruff]
line-length = 100
src = ["src"]

# The version files live at the repo root so MATLAB and Python read the same
# version.txt. A wheel has no repo around it, so copy them in beside the
# package or an installed MEA-NAP reports its version as "unknown".
[tool.hatch.build.targets.wheel.force-include]
"version.txt" = "meanap/version.txt"
"versions.json" = "meanap/versions.json"
